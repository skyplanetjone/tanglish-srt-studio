services:
  - type: web
    name: tanglish-srt-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIPTION_MODEL
        value: whisper-1
      - key: ROMANIZATION_MODEL
        value: gpt-4.1-mini
